name: 일별 상수도 사용량 수집

on:
  schedule:
    - cron: '0 23,0,1 * * *'  # KST 08·09·10시 (UTC 23·00·01) — 8시 미적재면 9·10시 재시도, dedup으로 자동 패스
  workflow_dispatch:       # 수동 실행 버튼도 활성화

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Python 설치
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 패키지 설치
        run: pip install -r pipeline/daily_water/requirements.txt

      - name: .env 생성
        run: |
          echo "ARISU_USER_ID=${{ secrets.ARISU_USER_ID }}" >> .env
          echo "ARISU_USER_PWD=${{ secrets.ARISU_USER_PWD }}" >> .env

      - name: 파이프라인 실행
        run: python pipeline/daily_water/run_daily.py

      - name: 결과 커밋
        run: |
          DATE=$(python3 -c "from datetime import date, timedelta; print(date.today() - timedelta(days=1))")
          CSV="data/daily/water/${DATE}.csv"

          # CSV를 임시 저장 후 원본 삭제 (브랜치 전환 충돌 방지)
          cp "${CSV}" "/tmp/${DATE}.csv"
          rm "${CSV}"

          # daily-collect 브랜치로 전환
          git fetch origin daily-collect
          git switch daily-collect
          mkdir -p data/daily/water
          cp "/tmp/${DATE}.csv" "${CSV}"

          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "${CSV}"
          git diff --staged --quiet || git commit -m "data: ${DATE} 일일 상수도 사용량 자동 수집"
          git pull --rebase origin daily-collect || true   # 승하차 잡과 동시 푸시 경합 대비
          git push origin daily-collect
