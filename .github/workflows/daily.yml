name: 일별 수도 사용량 수집 및 이상치 탐지

on:
  schedule:
    - cron: '0 23 * * *'  # 매일 23:00 UTC = 한국시간 08:00
  workflow_dispatch:       # 수동 실행 버튼도 활성화

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4
        with:
          ref: data/daily

      - name: Python 설치
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 패키지 설치
        run: pip install -r requirements.txt

      - name: .env 생성
        run: |
          echo "ARISU_USER_ID=${{ secrets.ARISU_USER_ID }}" >> .env
          echo "ARISU_USER_PWD=${{ secrets.ARISU_USER_PWD }}" >> .env

      - name: 파이프라인 실행
        run: python pipeline/run_daily.py

      - name: 결과 커밋
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/daily/
          git diff --staged --quiet || git commit -m "data: $(date +'%Y-%m-%d') 일일 사용량 자동 수집"
          git push origin data/daily
